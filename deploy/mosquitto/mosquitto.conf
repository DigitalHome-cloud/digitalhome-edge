# digitalhome.edge MQTT broker: phones as end devices (scan and control).
# Deployed to /opt/dhe/mosquitto/config/mosquitto.conf by deploy/bootstrap.sh.
#
# Nobody connects without a name and a password. Who may read and write what
# is kept by the Dynamic Security plugin: one client per QR code, made and
# revoked by Node-RED (contrib/dhc-panel), which is the only admin.

per_listener_settings false
allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Node-RED, on this box only.
listener 1883 127.0.0.1

# Phones on the home network: MQTT over WebSocket (the panel page).
listener 9001
protocol websockets

# A phone sends short JSON; nothing here needs more.
message_size_limit 4096
max_connections 200

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
